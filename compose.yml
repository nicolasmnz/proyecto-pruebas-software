services:
  db:
    image: postgres:18-alpine
    container_name: proyecto-pruebas-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: proyecto_pruebas
      POSTGRES_USER: proyecto_user
      POSTGRES_PASSWORD: proyecto_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
