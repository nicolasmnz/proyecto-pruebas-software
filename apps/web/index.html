<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Mira</title>
    <script>
      // Aplica el tema guardado antes de que cargue la app, para que no
      // parpadee. Repite las reglas de applyTheme (src/utils/theme.ts)
      (function () {
        var theme = "system";
        var accent = "blue";
        var highContrast = false;

        try {
          var stored = JSON.parse(localStorage.getItem("mira.theme")) || {};

          if (["system", "light", "dark"].indexOf(stored.theme) >= 0) {
            theme = stored.theme;
          }

          if (
            ["blue", "green", "purple", "orange"].indexOf(stored.accent) >= 0
          ) {
            accent = stored.accent;
          }

          highContrast = stored.highContrast === true;
        } catch (error) {
          // Sin preferencia legible se usan los valores por defecto
        }

        if (theme === "system") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }

        if (highContrast) {
          theme = theme === "dark" ? "contrast-dark" : "contrast";
        }

        var root = document.documentElement;

        root.setAttribute("data-theme", theme);

        if (!highContrast && accent !== "blue") {
          root.setAttribute("data-accent", accent);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
