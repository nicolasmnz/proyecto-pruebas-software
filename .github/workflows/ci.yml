name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  # 1. Calidad y pruebas unitarias
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  # 2. Pruebas de integración con PostgreSQL
  integration:
    name: Integration tests
    needs: quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: proyecto_pruebas_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d proyecto_pruebas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5434
      DB_NAME: proyecto_pruebas_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      PGPASSWORD: test_password
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Initialize test database
        run: |
          psql -v ON_ERROR_STOP=1 \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -f apps/api/bd/schema.sql

      - name: Run integration tests
        run: npm run test:integration

  # 3. Pruebas End-to-End
  e2e:
    name: E2E tests
    needs: [quality, integration]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Create environment file
        run: cp .env.example .env

      - name: Start application
        run: docker compose up -d --build

      - name: Show container status
        run: docker compose ps

      - name: Wait for API
        run: |
          curl \
            --retry 20 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:3000/api/health

      - name: Wait for frontend
        run: |
          curl \
            --retry 20 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:5173

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Show container logs
        if: failure()
        run: docker compose logs
