services:
  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: proyecto_pruebas_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql
      - ./apps/api/bd/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U test_user -d proyecto_pruebas_test
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_test_data:
